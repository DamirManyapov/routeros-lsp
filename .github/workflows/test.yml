name: Test

# Runs on every push and pull request, including the ones the schema update
# opens: a rebuilt schema that breaks the fixtures should never be merged.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
