name: Update command schema

# The command tree comes from tikoci/restraml, which publishes a schema per
# RouterOS release automatically. Rebuilding needs no router, so it can run
# unattended; a person only decides whether to merge.
on:
  schedule:
    # Mondays, early UTC — after a weekend of upstream releases, before anyone
    # is likely to be working in the repository.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      # 60 upstream files, ~62 MB. Caching them keeps a rerun to the handful
      # that are new, and means a brief upstream outage does not fail the job.
      - name: Cache upstream schemas
        uses: actions/cache@v4
        with:
          path: |
            schema/cache
            schema/cache-deep
          key: restraml-${{ github.run_id }}
          restore-keys: restraml-

      - name: Keep the current schema for comparison
        run: |
          cp schema/schema.json /tmp/schema-before.json
          cp schema/choices.json /tmp/choices-before.json

      - name: Rebuild from upstream
        run: npm run schema

      - name: Stop if nothing changed
        id: changed
        run: |
          if cmp -s /tmp/schema-before.json schema/schema.json \
             && cmp -s /tmp/choices-before.json schema/choices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Schema is unchanged; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A rebuilt schema that fails the fixtures is worse than a stale one, so
      # the tests decide whether the PR is opened at all.
      - name: Test against the rebuilt schema
        if: steps.changed.outputs.changed == 'true'
        run: npm test

      - name: Describe what changed
        if: steps.changed.outputs.changed == 'true'
        id: describe
        run: |
          {
            echo "body<<PR_BODY_EOF"
            node schema/describe-changes.mjs /tmp/schema-before.json schema/schema.json
            echo ""
            echo "Rebuilt from [tikoci/restraml](https://github.com/tikoci/restraml)."
            echo "Value types are unaffected — those come from a device, not from upstream."
            echo "PR_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: schema-update
          commit-message: "update command schema from upstream"
          title: "Update command schema"
          body: ${{ steps.describe.outputs.body }}
          add-paths: |
            schema/schema.json
            schema/choices.json
          delete-branch: true
